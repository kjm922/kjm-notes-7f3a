name: 핫딜 수집

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
     

      - name: 패키지 설치
        run: |
          pip install -q requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: 수집
        run: python scrape.py

      - name: 결과 커밋
        run: |
          git config user.name "hotdeal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/deals.json
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "update deals $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase -X theirs && git push)
