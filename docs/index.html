<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>핫딜 통합 · 상품 링크</title>
<style>body{font:16px/1.6 system-ui;background:#f5f7fb;color:#182338;margin:0}main{max-width:940px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p,small{color:#57647a}input,button{font:inherit;padding:10px;border:1px solid #ccd4e2;border-radius:8px}input{width:65%;background:white}button{cursor:pointer}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}article{background:white;border:1px solid #e2e7ee;border-radius:12px;padding:18px;margin:12px 0}article a{font-weight:600;color:#19499a;text-decoration:none}article a:hover{text-decoration:underline}.price{font-weight:700;color:#18396c}#status{white-space:pre-line;font-size:13px}.empty{padding:30px;background:white;border-radius:12px}</style></head>
<body><main><h1>핫딜 통합</h1><p>상품 정보는 간단히, 자세한 내용은 원문에서 확인하세요.</p><nav id="sources"></nav><input id="q" type="search" placeholder="상품명·판매처 검색"> <button id="refresh">화면 새로고침</button><p id="status">불러오는 중…</p><section id="list"></section><p><small>이미지·본문·댓글은 제공하지 않습니다. 가격·재고·배송 조건은 원문에서 확인하세요. 접근이 제한된 출처는 수집을 중단합니다.</small></p></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={items:[],status:{}},selected='all';
function safe(url){try{return new URL(url).protocol==='https:'}catch{return false}}
function render(){const now=Date.now()/1000,q=document.querySelector('#q').value.toLowerCase();document.querySelector('#sources').innerHTML='<button data-site="all">전체</button>'+Object.entries(data.status).map(([k,s])=>`<button data-site="${esc(k)}">${esc(s.name)}</button>`).join('');document.querySelectorAll('[data-site]').forEach(b=>{b.style.fontWeight=b.dataset.site===selected?'700':'400';b.onclick=()=>{selected=b.dataset.site;render()}});const rows=data.items.filter(x=>x.expires_at>now&&safe(x.url)&&(selected==='all'||x.site===selected)&&(x.title+' '+x.shop).toLowerCase().includes(q));document.querySelector('#list').innerHTML=rows.length?rows.map(x=>`<article><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><br><small>${esc(data.status[x.site]?.name)} · ${esc(x.shop)}</small> <span class="price">${esc(x.price)}</span> <small>${esc(x.shipping)}</small></article>`).join(''):'<div class="empty">현재 표시할 상품이 없습니다. 아래 원본 게시판에서 직접 확인할 수 있습니다.</div>';document.querySelector('#status').innerHTML=Object.values(data.status).map(s=>`<span>${esc(s.name)}: ${s.blocked?'접근 정책·응답 확인으로 수집 중단':((s.count||0)+'건')} · <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">원본 게시판</a></span>`).join('<br>')+'<br>화면 새로고침은 저장된 목록만 읽습니다. 상품은 확인 후 1시간까지만 표시됩니다.'}
async function load(){try{const r=await fetch('deals.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();render()}catch{document.querySelector('#status').textContent='목록을 불러오지 못했습니다. 잠시 후 새로고침하세요.'}}
document.querySelector('#refresh').onclick=load;document.querySelector('#q').oninput=render;setInterval(render,60000);load();
</script></body></html>
